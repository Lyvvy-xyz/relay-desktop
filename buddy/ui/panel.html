              <span class="dot blue"></span> <span id="typing-label">Working…</span>
            </div>
            <form class="composer" id="composer">
              <div class="row model">
                <span class="chip" id="chat-chip"></span
                ><select id="chat-project" aria-label="Chat project"></select>
              </div>
              <div class="inputbox">
                <textarea id="message" aria-label="Message" placeholder="Message the project…"></textarea>
                <div class="row">
                  <button class="quiet" id="show-wrong" type="button">Screenshot</button
                  ><span class="grow"></span
                  ><button class="primary" type="submit" id="send-message">Send</button>
                </div>
              </div>
              <div class="tiny muted hint">Enter to send · Shift + Enter for a new line</div>
            </form>
          </section>
          <section class="view pad" id="view-activity" role="tabpanel" hidden>
            <div class="filters">
              <select id="activity-project" aria-label="Filter activity by project">
                <option value="">All projects</option></select
              ><select id="activity-type" aria-label="Filter activity by type">
                <option value="">All activity</option>
                <option value="files">Files</option>
                <option value="screenshot">Screenshots</option>
                <option value="failed">Refused</option>
              </select>
            </div>
            <ol class="activity" id="activity"></ol>
          </section>
          <section class="view" id="view-send" role="tabpanel" hidden>
            <div class="drop-stage" id="drop-empty">
              <svg class="frog" viewBox="0 0 40 40" aria-hidden="true"><use href="#art-frog-eat" /></svg>
              <p>Drop files or folders on the frog.</p>
            </div>
            <div class="pad" id="send-content" hidden>
              <div class="row between">
                <span class="muted tiny" id="item-count">0 items</span
                ><button class="quiet" id="clear-files" type="button">Clear all</button>
              </div>
              <ul class="files" id="files"></ul>
              <label class="field-label" for="send-project">Project</label
              ><select class="full" id="send-project"></select
              ><label class="field-label" for="send-note">Note (optional)</label
              ><textarea id="send-note"></textarea>
              <p class="tiny muted">Edits can be saved to originals; previous versions are kept.</p>
              <div class="row between">
                <span class="tiny muted" id="total-size"></span
                ><button class="primary" id="send-files" type="button" disabled>Send 0 items</button>
              </div>
            </div>
            <details class="history" id="sent-history">
              <summary id="sent-summary">Sent history · 0 deliveries</summary>
              <div id="sent-detail"></div>
            </details>
          </section>
        </div>
      </div>
    </article>
    <script src="vendor/highlight.min.js"></script>
    <script type="module" src="panel.js"></script>
  </body>
</html>
